[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "portabyte"
version = "0.1.0"
description = "Official Python SDK for Portabyte file uploads and delivery"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Portabyte" }]
keywords = ["portabyte", "files", "uploads", "storage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://portabyte.dev"
Documentation = "https://portabyte.dev/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/portabyte"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88
